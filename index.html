<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unified Calendar</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <header class="topbar">
      <h1>Unified Calendar</h1>
      <div class="controls">
        <span id="sessionLabel"></span>
        <label>
          表示ユーザー
          <select id="currentUser"></select>
        </label>
        <button id="todayBtn">今日へ</button>
        <button id="newEventBtn">予定を追加</button>
        <button id="newGroupBtn">グループ作成</button>
        <button id="logoutBtn">ログアウト</button>
      </div>
    </header>

    <aside class="sidebar">
      <section>
        <h2>表示カテゴリ</h2>
        <div id="calendarFilters"></div>
      </section>
      <section>
        <h2>共有グループ</h2>
        <ul id="groupList"></ul>
      </section>
      <section>
        <h2>招待リンク受け取り</h2>
        <input id="inviteInput" placeholder="招待トークンを貼り付け" />
        <button id="acceptInviteBtn">招待を確認</button>
      </section>
    </aside>

    <main>
      <div class="calendar-scroll" id="calendarScroll"></div>
    </main>

    <dialog id="loginDialog">
      <form id="loginForm" method="dialog">
        <h3>ログイン</h3>
        <p>Googleログイン（推奨）またはデモユーザーでログインできます。</p>
        <div id="googleLoginMount"></div>
        <label>デモユーザーでログイン
          <select id="loginUser"></select>
        </label>
        <menu>
          <button value="default" id="demoLoginBtn">デモログイン</button>
        </menu>
      </form>
    </dialog>

    <dialog id="eventDialog">
      <form id="eventForm" method="dialog">
        <h3 id="eventDialogTitle">予定を追加</h3>
        <input type="hidden" id="eventId" />
        <label>タイトル（任意）<input id="title" placeholder="未入力なら「(無題)」" /></label>
        <label>種別
          <select id="category">
            <option>予定</option>
            <option>職場</option>
            <option>自宅</option>
            <option>その他</option>
          </select>
        </label>
        <label>開始<input id="start" type="datetime-local" /></label>
        <label>終了<input id="end" type="datetime-local" /></label>
        <label>場所<input id="location" /></label>
        <label>URL<input id="url" type="url" placeholder="https://" /></label>
        <label>説明<textarea id="description"></textarea></label>
        <label>共有先グループ
          <select id="shareGroup">
            <option value="">共有しない</option>
          </select>
        </label>

        <menu>
          <button type="button" id="deleteEventBtn" class="danger">削除</button>
          <button type="button" id="cancelEventBtn">キャンセル</button>
          <button value="default" id="saveEventBtn">保存</button>
        </menu>
      </form>
    </dialog>

    <dialog id="groupDialog">
      <form id="groupForm" method="dialog">
        <h3>グループ作成</h3>
        <label>グループ名<input id="groupName" required /></label>
        <label>説明<input id="groupDescription" /></label>
        <menu>
          <button type="button" id="cancelGroupBtn">キャンセル</button>
          <button value="default">作成</button>
        </menu>
      </form>
    </dialog>

    <dialog id="inviteDialog">
      <article id="invitePreview"></article>
      <menu>
        <button type="button" id="rejectInviteBtn">拒否</button>
        <button type="button" id="confirmInviteBtn">参加する</button>
      </menu>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
